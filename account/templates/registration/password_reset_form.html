{% extends "base.html" %}
{% block title %}Reset your password{% endblock title %}
{% block content %}
    <h1>Forgotten your password?</h1>
    <p>Enter your email addrress to obtain a new password.</p>
    <form method="post">
        {{ form.as_p }}
        {% csrf_token %}
        <p>
            <input type="submit" value="Send email">
        </p>
    </form>
{% endblock content %}
